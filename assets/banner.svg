<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="wechat-mp · 微信公众号内容工坊 banner">
  <defs>
    <radialGradient id="glowBlue" cx="82%" cy="-10%" r="80%">
      <stop offset="0%" stop-color="#4F8CFF" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#4F8CFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="4%" cy="118%" r="55%">
      <stop offset="0%" stop-color="#38E1D6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38E1D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="100%" stop-color="#38E1D6"/>
    </linearGradient>
    <linearGradient id="cardLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F7FF"/>
      <stop offset="100%" stop-color="#E6EDFF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="#0B1020"/>
  <rect width="1200" height="400" fill="url(#glowBlue)"/>
  <rect width="1200" height="400" fill="url(#glowCyan)"/>

  <!-- editorial rules -->
  <rect x="60" y="48" width="3" height="304" fill="url(#accentGrad)"/>
  <rect x="60" y="48" width="760" height="2" fill="#FFFFFF" opacity="0.14"/>
  <rect x="60" y="350" width="760" height="1" fill="#FFFFFF" opacity="0.14"/>
