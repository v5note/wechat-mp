  <text x="228" y="284" font-family="'Inter',sans-serif" font-size="15" font-weight="700" fill="#38E1D6">·</text>
  <text x="240" y="284" font-family="'Inter','PingFang SC',sans-serif" font-size="15" font-weight="500" fill="#AFC0E0" letter-spacing="0.5">双版本</text>
  <text x="294" y="284" font-family="'Inter',sans-serif" font-size="15" font-weight="700" fill="#38E1D6">·</text>
  <text x="306" y="284" font-family="'Inter','PingFang SC',sans-serif" font-size="15" font-weight="500" fill="#AFC0E0" letter-spacing="0.5">发布清单</text>

  <text x="80" y="314" font-family="'Inter','PingFang SC',sans-serif" font-size="14" font-weight="400" fill="#7E8FB0" letter-spacing="0.4">2 版本 × 2 格式 = 4 个样例   ·   自动校验   ·   总览预览</text>

  <text x="80" y="370" font-family="'Inter','PingFang SC',sans-serif" font-size="12" font-weight="400" fill="#5A6A8A" letter-spacing="0.4">Node.js 18+  ·  Headless Chrome  ·  zero npm deps</text>

