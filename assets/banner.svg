  <text x="80" y="178" font-family="'Inter','PingFang SC','Helvetica Neue',Arial,sans-serif" font-size="86" font-weight="900" letter-spacing="-2.5" fill="#FFFFFF">WeChat <tspan fill="#4F8CFF">MP</tspan></text>

  <text x="80" y="224" font-family="'Songti SC','Noto Serif SC','Source Han Serif SC',serif" font-size="24" font-weight="700" fill="#DCE6FF" letter-spacing="1">微信公众号内容工坊</text>

  <text x="80" y="284" font-family="'Inter','PingFang SC',sans-serif" font-size="15" font-weight="500" fill="#AFC0E0" letter-spacing="0.5">贴图套图</text>
  <text x="148" y="284" font-family="'Inter',sans-serif" font-size="15" font-weight="700" fill="#38E1D6">·</text>
