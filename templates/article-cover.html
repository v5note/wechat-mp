<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<!-- article-cover.html · 文章封面 (1080×460, 2.35:1)
     占位符: BASE_CSS / THEME / ICON_SPRITE / KICKER / TITLE / SUB / VISUAL / BRAND -->
<style>
{{BASE_CSS}}
.cover{width:1080px;height:460px;position:relative;overflow:hidden;
  background:linear-gradient(140deg,var(--bg1),var(--bg2) 70%,var(--bg3));color:var(--text)}
.cover .page{padding:56px 72px;flex-direction:row;align-items:center;gap:48px}
.cover .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.cover .kicker{font-size:24px}
.cover .ttl{font-size:60px;font-weight:800;line-height:1.12;letter-spacing:-1.5px;white-space:nowrap}
.cover .sub{font-size:26px;color:var(--text-2)}
.cover .vis{flex:0 0 42%;min-width:0;max-height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cover .browser{max-width:100%}
/* compact component scale so any hero fits the 460px-tall cover */
.cover .stack{gap:8px}
.cover .slayer{padding:9px 12px;gap:10px}
.cover .slayer .sname{font-size:17px;width:78px}
.cover .schip{font-size:13px;padding:4px 9px}
.cover .tiles{gap:9px}
.cover .tile{padding:12px 8px;gap:6px}
.cover .tile .ic{width:24px;height:24px}
.cover .tile .tl{font-size:15px}
.cover .steps{gap:8px}
.cover .step{padding:12px 9px;gap:6px}
.cover .step .snum{width:28px;height:28px;font-size:15px;border-radius:8px}
.cover .step .st{font-size:15px}
.cover .step .sd{font-size:12px}
.cover .stat{padding:14px 10px}
.cover .stat .num{font-size:32px}
.cover .stat .lb{font-size:13px;margin-top:6px}
.cover .matrix{gap:9px}
.cover .mxcard{padding:10px 12px}
.cover .mxttl{font-size:16px}.cover .mxdesc{font-size:12px}.cover .mxrow{font-size:12px}
</style>
</head>
<body class="cover {{THEME}}">
{{ICON_SPRITE}}
<div class="bg"></div>
<div class="page">
  <div class="txt">
    <div class="kicker">{{KICKER}}</div>
    <div class="ttl">{{TITLE}}</div>
    <div class="sub">{{SUB}}</div>
  </div>
  <div class="vis">{{VISUAL}}</div>
</div>
</body>
</html>
